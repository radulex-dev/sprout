name: Deploy

# Runs only after the CI workflow succeeds on master, so a red build can never reach
# production. `workflow_run` always reads this file from the default branch. Coolify's own
# push-triggered auto-deploy is deliberately disabled, so this workflow is the only path to
# production and a push cannot bypass the CI gate.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Coolify builds the tip of its configured branch, not a commit passed in from here, so
      # the commit CI passed on is recorded in the log but does not pin the build.
      - name: Trigger the Coolify deployment
        id: trigger
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          CI_PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for name in COOLIFY_BASE_URL COOLIFY_TOKEN COOLIFY_APP_UUID; do
              if [ -z "${!name:-}" ]; then
                  echo "::error title=Missing Coolify secret::${name} is not set; add it as a repository secret."
                  exit 1
              fi
          done

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "${response_file}" --write-out '%{http_code}' \
              --request POST \

              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" || true)"

          if [ "${http_code:-000}" != '200' ]; then
              echo "::error title=Coolify deploy request failed::POST /api/v1/deploy answered HTTP ${http_code:-no response}."
              cat "${response_file}"
              exit 1
          fi

          deployment_uuid="$(jq --raw-output '.deployments[0].deployment_uuid // empty' "${response_file}")"
          if [ -z "${deployment_uuid}" ]; then
              echo "::error title=Coolify deploy request failed::The response contained no deployment UUID."
              cat "${response_file}"
              exit 1
          fi

          echo "deployment_uuid=${deployment_uuid}" >> "${GITHUB_OUTPUT}"
          echo "Queued Coolify deployment ${deployment_uuid} for the commit CI passed on (${CI_PASSED_SHA})."

      # The Coolify post-deployment hook (`bun run db:migrate`) does not fail the deployment
      # when it fails, so this guard is the only thing standing between a failed migration and
      # a green run. It polls the deployment this run queued; `/api/v1/deployments/<id>` needs
      # the token's `read` permission, and a token scoped to `deploy` only fails this step by
      # design rather than reporting an unverified success. Fallbacks, cheapest first:
      # (1) grant COOLIFY_TOKEN - or a second token - the `read` permission;
      # (2) have the post-deployment command write a durable success marker, e.g. a row
      #     stamped with the migrated commit, and assert it here;
      # (3) expose the applied schema version through an application endpoint and assert it.
      - name: Verify the deployment finished
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail

          status_file="$(mktemp)"
          deadline=$(( SECONDS + 900 ))

          while :; do
              http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                  --output "${status_file}" --write-out '%{http_code}' \
                  --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
                  "${COOLIFY_BASE_URL}/api/v1/deployments/${DEPLOYMENT_UUID}" || true)"

              case "${http_code:-000}" in
                  200) ;;
                  401 | 403)
                      echo "::error title=Deployment unverified::The Coolify API token cannot read deployment status (HTTP ${http_code}), so the post-deployment migration outcome is unknown. Failing instead of reporting an unverified green deploy; see the comment above this step for the fallback options."
                      exit 1
                      ;;
                  *)
                      echo "Coolify status request answered HTTP ${http_code:-no response}; retrying in 15s."
                      sleep 15
                      continue
                      ;;
              esac

              status="$(jq --raw-output '.status // empty' "${status_file}")"
              echo "Coolify deployment ${DEPLOYMENT_UUID}: ${status:-unknown}"

              case "${status}" in
                  finished | success)
                      exit 0
                      ;;
                  failed | cancelled | canceled)
                      echo "::error title=Deployment failed::Coolify deployment ${DEPLOYMENT_UUID} ended as '${status}'; its post-deployment migration may have failed. Check the Coolify deployment log."
                      exit 1
                      ;;
              esac

              if [ "${SECONDS}" -ge "${deadline}" ]; then
                  echo "::error title=Deployment unverified::Coolify deployment ${DEPLOYMENT_UUID} was still '${status:-unknown}' after 15 minutes."
                  exit 1
              fi

              sleep 15
          done
