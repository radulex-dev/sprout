name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://sprout:sprout@localhost:5432/sprout
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-build
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:rules
      - run: bun run lint
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run test:size

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck .github/scripts/*.sh
